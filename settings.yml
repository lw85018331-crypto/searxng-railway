use_default_settings: true

general:
  instance_name: "lgbd-searxng"
  debug: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "86dafeb713fe93a755950932fe0566b0f4425cd74c4f0091c3fa585694f9f56c"
  limiter: false
  public_instance: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  formats:
    - html
    - json

ui:
  static_use_hash: true

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  max_redirects: 5

# ===== 引擎策略（Railway 数据中心 IP，2026-10-04 逐个实测）=====
#
# 实测方法：curl "…/search?q=<q>&format=json&engines=<name>" 看 results /unresponsive_engines
#
# 【主搜索引擎 · general 分类】
#   OK  google cse  1.2s  20 条  走 API，数据中心 IP 友好
#   OK  bing        1.1s  10 条  独立于 google/bing 主站API
#   OK  startpage   1.9s  20 条  单独可用
#   OK  mojeek      1.8s  20 条  单独可用
#   组合实测：bing+google cse = 1.2s / 26 条 / 15 个不同域名（最优）
#startpage+mojeek 组合会卡到 10s+ → 不进默认组合，按需 engines 参数指定
#
# 【被风控·已禁用主引擎及其子引擎】
#   google  access denied / google news   access denied
#   brave   429         / brave.news      unexpected crash
#   ddg     CAPTCHA     / duckduckgo news 仍崩溃
#   qwant   CAPTCHA
#   ⚠️ 子引擎必须逐个禁用！只禁主引擎时brave.news / brave.images /
#      brave.videos / duckduckgo news / duckduckgo images 仍在跑并持续报错。
#
# 【已实测故障的专项引擎】
#   bing news → parsing error（2026-10-04）
engines:
  # ---- 主搜索引擎 ----
  - name: google cse
    disabled: false
  - name: bing
    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false

  # ---- 垂直领域（实测可用，命中时质量高）----
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  - name: stackexchange
    disabled: false
  - name: github
    disabled: false
  - name: mdn
    disabled: false

  # ---- 被数据中心 IP 风控的主引擎 ----
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: qwant
    disabled: true

  # ---- 上述引擎的子引擎：必须逐个禁用，否则持续 crash/denied ----
  - name: google news
    disabled: true
  - name: google images
    disabled: true
  - name: google videos
    disabled: true
  - name: brave.news
    disabled: true
  - name: brave.images
    disabled: true
  - name: brave.videos
    disabled: true
  - name: duckduckgo news
    disabled: true
  - name: duckduckgo images
    disabled: true
  - name: duckduckgo videos
    disabled: true

  # ---- 实测故障的子引擎 ----
  - name: bing news
    disabled: true
