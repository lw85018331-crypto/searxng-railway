    disabled: false
  - name: startpage
    disabled: false
  - name: mojeek
    disabled: false
  - name: wikipedia
    disabled: false
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: qwant
    disabled: true
